# Kubernetes secrets example for chat platform
# Apply with: kubectl apply -f kubernetes-secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: chat-platform-db-secret
  namespace: chat-platform
type: Opaque
data:
  # Base64 encoded values
  # username: chatuser (Y2hhdHVzZXI=)
  # password: secure-db-password (c2VjdXJlLWRiLXBhc3N3b3Jk)
  username: Y2hhdHVzZXI=
  password: c2VjdXJlLWRiLXBhc3N3b3Jk

---
apiVersion: v1
kind: Secret
metadata:
  name: chat-platform-redis-secret
  namespace: chat-platform
type: Opaque
data:
  # password: secure-redis-password (c2VjdXJlLXJlZGlzLXBhc3N3b3Jk)
  password: c2VjdXJlLXJlZGlzLXBhc3N3b3Jk

---
apiVersion: v1
kind: Secret
metadata:
  name: chat-platform-jwt-secret
  namespace: chat-platform
type: Opaque
data:
  # jwt-secret: your-super-secure-jwt-secret-key-here (eW91ci1zdXBlci1zZWN1cmUtand0LXNlY3JldC1rZXktaGVyZQ==)
  jwt-secret: eW91ci1zdXBlci1zZWN1cmUtand0LXNlY3JldC1rZXktaGVyZQ==

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-platform-config
  namespace: chat-platform
data:
  DATABASE_HOST: "postgres-cluster.database.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "chatplatform"
  REDIS_ADDRESSES: "redis-cluster-0.redis.svc.cluster.local:6379,redis-cluster-1.redis.svc.cluster.local:6379,redis-cluster-2.redis.svc.cluster.local:6379"
  SERVICE_DISCOVERY_TYPE: "consul"
  SERVICE_DISCOVERY_ADDRESS: "consul.consul.svc.cluster.local:8500"
  CONFIG_SOURCE: "kubernetes"